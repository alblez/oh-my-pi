name: Warm bazel disk cache

# GitHub-hosted runners cannot use the cluster remote cache and only see
# actions/cache entries created on the default branch, and bazel action keys
# do not transfer across runner environments (a kata-produced disk cache
# misses every action on a hosted image) — so seed each hosted consumer from
# the same image it runs on:
#
#   warm_darwin (macos-15/xcode-27) -> scopes `release-darwin-*`, consumed
#                             by release_binary_hosted. Releases are the only
#                             other producers for these scopes and a release
#                             always changes CONFIG_HASH (version bump
#                             rewrites Cargo.toml/Cargo.lock). The x64 addon
#                             cross-builds on macos-15 Apple silicon; arm64
#                             builds on xcode-27 for the Foundation Models
#                             bridge (see ci.yml).
#   warm_bun (ubuntu-22.04)-> the shared `bun-<os>-<lockhash>` store entry.
#                             PR jobs restore it but never save (per-PR-ref
#                             copies of the ~500 MB store once ate ~9.4 GB of
#                             the 10 GB repo cache quota and evicted every
#                             bazel archive).
#
# The v3 key embeds a crates/** source fingerprint, so a native change on
# main means an exact miss: the build seeds from a previous generation via
# the prefix/bare restore keys and the refreshed archive is saved. An exact
# hit makes every invocation a cache replay and saves nothing.
#
# Paths mirror the cache-key inputs (bazel-cache action) plus bun.lock — a
# packages/** push cannot change any archive, so it does not trigger a warm.

on:
   push:
      branches: [main]
      paths:
         - "crates/**"
         - "bazel/**"
         - "MODULE.bazel"
         - "MODULE.bazel.lock"
         - "BUILD.bazel"
         - ".bazelrc"
         - ".bazelignore"
         - ".bazelversion"
         - "Cargo.toml"
         - "Cargo.lock"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         - "bun.lock"
         - ".github/**"
   workflow_dispatch:
      inputs:
         only:
            description: "Run one warm job (darwin|bun); empty runs all"
            type: string
            default: ""

permissions:
   contents: read

# No cancel-in-progress: a cancelled warm saves nothing, and the first darwin
# warm on a cold runner takes long enough that back-to-back native pushes
# would cancel it forever. Superseded queued runs still collapse to the
# newest one, and staleness is harmless — consumers seed via prefix keys.
concurrency:
   group: bazel-cache-warm
   cancel-in-progress: false

jobs:
   # Keeps the release_binary_hosted darwin scopes seeded near HEAD so a
   # release's bazel build is the version-bump delta, not a cold graph. Scope,
   # runner image, and target must match the release_binary_hosted matrix in
   # ci.yml; the arm64 Xcode 27 build has a separate cache from macos-15 x64.
   warm_darwin:
      name: "Seed darwin release bazel cache: ${{ matrix.target }}"
      if: inputs.only == '' || inputs.only == 'darwin'
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: macos-15, target: darwin-x64-baseline, scope: release-darwin-x64, fallback: "" }
               - { os: xcode-27, target: darwin-arm64, scope: release-darwin-arm64-xcode27, fallback: "" }
      runs-on: ${{ matrix.os }}
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         # scripts/bazel-natives.ts is dependency-free (node builtins only), so
         # no `bun install` is needed; the bazel-natives action restores,
         # builds, and saves the scope's disk cache.
         - uses: ./.github/actions/bazel-natives
           with:
              targets: ${{ matrix.target }}
              cache-scope: ${{ matrix.scope }}
              fallback-scope: ${{ matrix.fallback }}

   # Produces the shared bun store entry PR jobs restore. bun-install's save
   # half only runs on non-PR events, and main CI jobs run on omp-kata (PVC
   # store, no GitHub cache), so this is the sole hosted-runner producer.
   warm_bun:
      name: Seed bun store cache
      if: inputs.only == '' || inputs.only == 'bun'
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install

   debug_xcode27:
      name: "Debug xcode-27 thiserror_impl E0463"
      if: inputs.only == 'debug'
      runs-on: xcode-27
      timeout-minutes: 90
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Toolchain facts
           run: |
              set -x
              sw_vers
              xcode-select -p
              xcodebuild -version
              xcrun --show-sdk-path
              xcrun --find ld
              xcrun ld -v 2>&1 | head -3
              xcrun clang --version
              ls -d /Library/Developer/CommandLineTools /Applications/Xcode*.app || true
              env | sort | grep -Ei 'sdk|developer|xcode|macosx|^cc=|cflags|ldflags|rust' || true
         - name: Build natives (fails)
           id: build
           continue-on-error: true
           run: |
              set -o pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              bazelisk build --config=ci --sandbox_debug //:natives-darwin-arm64 2>&1 | tail -80
         - name: Verify addon
           if: steps.build.outcome == 'success'
           run: |
              set -x
              for N in $(bazelisk cquery --config=ci --output=files //:natives-darwin-arm64 2>/dev/null); do
                file "$N"
                otool -l "$N" | grep -A4 LC_BUILD_VERSION
                otool -L "$N" | grep -F FoundationModels.framework
                cp "$N" /tmp/addon.node
                node -e 'const m=require("/tmp/addon.node"); console.log("addon loaded, exports:", Object.keys(m).length)'
              done
         - name: Post-mortem
           if: always()
           run: |
              set -x
              EXEC=$(bazelisk info --config=ci execution_root 2>/dev/null)
              OUT=$EXEC/bazel-out/darwin_arm64-opt-exec-ST-752e27cef48a/bin/external
              R=$OUT/rules_rust++rust+rust_macos_aarch64__aarch64-apple-darwin__nightly_tools/rust_toolchain/bin/rustc
              "$R" -vV || true
              bazelisk aquery --config=ci 'mnemonic("Rustc", deps(//:natives-darwin-arm64))' 2>/dev/null \
                | awk '/rrc__thiserror-impl-1.0.69\/\/:thiserror_impl/{p=1} p&&/^$/{exit} p' | tr ' ' '\n' \
                | grep -E 'linker|link-arg|crate-type|--target|sysroot' || true
              ls -la "$OUT/rules_rust++i2+rrc__thiserror-impl-1.0.69/" || true
              for D in "$OUT"/rules_rust++i2+rrc__thiserror-impl-1.0.69/libthiserror_impl-*.dylib; do
                file "$D"
                otool -l "$D" | grep -B3 -A8 -E 'sectname (\.rustc|__rustc)' || echo "NO .rustc SECTION"
                otool -l "$D" | grep -E 'sectname|segname' | sort | uniq -c
                nm -gU "$D" | grep -E 'rust_metadata|__rustc_proc_macro_decls' || echo "NO rust_metadata/proc_macro_decls EXPORT"
                otool -L "$D"
                cp "$D" /tmp/thiserror_impl.dylib
              done
              mkdir -p /tmp/t && cd /tmp/t
              echo 'pub use thiserror_impl::*;' > use.rs
              RUSTC_LOG=rustc_metadata=info "$R" --crate-type rlib --edition 2021 use.rs \
                --extern thiserror_impl=/tmp/thiserror_impl.dylib -o libuse.rlib 2>&1 | tail -40 || true
              printf '%s\n' 'extern crate proc_macro;' \
                '#[proc_macro_derive(Foo)] pub fn foo(_: proc_macro::TokenStream) -> proc_macro::TokenStream { Default::default() }' > pm.rs
              echo 'pub use pm::*;' > usepm.rs
              for L in "$(xcrun -f clang)" /Library/Developer/CommandLineTools/usr/bin/clang; do
                [ -x "$L" ] || continue
                echo "=== plain rustc proc-macro via linker $L"
                "$R" --crate-type proc-macro --crate-name pm --edition 2021 pm.rs -o libpm.dylib -C linker="$L" &&
                  { otool -l libpm.dylib | grep -c 'sectname .rustc' || true; nm -gU libpm.dylib | grep -c rust_metadata || true;
                    "$R" --crate-type rlib --edition 2021 usepm.rs --extern pm=libpm.dylib -o libusepm.rlib && echo "CONSUME OK"; }
              done
         - uses: actions/upload-artifact@v4
           if: always()
           with:
              name: thiserror-impl-dylib
              path: /tmp/thiserror_impl.dylib
              if-no-files-found: warn
